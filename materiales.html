<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="includes/images/a2.png">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Materiales (diagnóstico) - Genshin +</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="includes/styles.css" rel="stylesheet">
  <script src="includes/api.js"></script>
  <style>
    .mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; }
    .mcell { border: 1px solid #E5E7EB; border-radius: 10px; padding: .6rem; text-align: center; background: #fff; font-size: .8rem; }
    .mcell img { width: 56px; height: 56px; object-fit: contain; }
    .mcell .mid { color: #6B7280; font-variant-numeric: tabular-nums; }
    .mbar { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1rem 0; }
    .mbar input, .mbar select { border: 1px solid #D1D5DB; border-radius: 8px; padding: .5rem .7rem; }
    html[data-theme="dark"] .mcell { background: #1E293B; border-color: #334155; color: #F1F5F9; }
  </style>
</head>
<body data-page="materiales">
  <main class="container py-4">
    <h1 class="h3">Materiales de genshin-db (diagnóstico)</h1>
    <p class="text-muted">Lista de materiales ordenada de más nuevo a más viejo (por ID). Busca los de Anastasya y Danica y dime el nombre o el ID. Esta página no está enlazada en el menú.</p>
    <div class="mbar">
      <input id="q" type="search" placeholder="Buscar por nombre o ID" aria-label="Buscar">
      <select id="cat" aria-label="Categoría"><option value="">Todas las categorías</option></select>
      <select id="lim" aria-label="Cantidad"><option value="60">Últimos 60</option><option value="200">Últimos 200</option><option value="100000">Todos</option></select>
      <button id="copy" class="btn btn-primary" type="button">Copiar lista visible</button>
    </div>
    <p id="status" class="text-muted" role="status">Cargando…</p>
    <div id="grid" class="mgrid"></div>
  </main>
  <script>
  (async () => {
    const $ = s => document.querySelector(s), API = window.GenshinAPI;
    const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    let all = [];
    try {
      const r = await API.getAll('materials', null, { allowPerName: false });
      all = (r || []).filter(x => x && x.id).sort((a, b) => Number(b.id) - Number(a.id));
    } catch (e) { $('#status').innerHTML = 'No se pudo cargar: ' + esc(e.message || e); return; }
    const cats = Array.from(new Set(all.map(x => x.materialType || x.category || '').filter(Boolean))).sort();
    $('#cat').innerHTML += cats.map(c => `<option>${esc(c)}</option>`).join('');
    let shown = [];
    function render() {
      const q = $('#q').value.trim().toLowerCase(), c = $('#cat').value, n = Number($('#lim').value);
      shown = all.filter(x => (!c || (x.materialType || x.category) === c) && (!q || String(x.id).includes(q) || String(x.name).toLowerCase().includes(q))).slice(0, n);
      $('#status').textContent = `Mostrando ${shown.length} de ${all.length}`;
      $('#grid').innerHTML = shown.map(x => `<div class="mcell">${API.imgHtml(API.materialIconSources(x.id, x), '', x.name, 56, 56)}<div class="fw-semibold">${esc(x.name)}</div><div class="mid">${esc(x.id)}</div></div>`).join('');
    }
    ['#q', '#cat', '#lim'].forEach(s => $(s).addEventListener('input', render));
    $('#copy').addEventListener('click', () => {
      const t = shown.map(x => `${x.id}\t${x.name}`).join('\n');
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { $('#copy').textContent = '¡Copiado!'; setTimeout(() => $('#copy').textContent = 'Copiar lista visible', 1500); }).catch(() => alert(t));
    });
    render();
  })();
  </script>
</body>
</html>
