<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="includes/images/a2.png">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracker - Genshin +</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="includes/styles.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="includes/api.js"></script>
  <script src="includes/scripts.js"></script>
  <script src="includes/plan.js"></script>
  <script src="includes/extras.js"></script>
  <script src="includes/tracker.js"></script>
</head>
<body data-page="tracker">
  <nav class="navbar navbar-expand-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z"/></svg>
        Genshin +
      </a>
      <div class="navbar-nav flex-row gap-1">
        <a class="nav-link" href="index.html">Inicio</a>
        <a class="nav-link" href="personajes.html">Personajes</a>
        <a class="nav-link" href="tracker.html">Tracker</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1 class="display-title mb-2">Tracker</h1>
    <p class="muted" id="track-summary" aria-live="polite" hidden></p>

    <div class="sheet">
    <div class="d-flex flex-wrap gap-2 mb-3" id="backup-bar">
      <button type="button" class="btn-ghost" id="btn-export">Exportar progreso</button>
      <button type="button" class="btn-ghost" id="btn-import">Importar progreso</button>
      <input type="file" id="file-import" accept="application/json,.json" hidden>
      <div class="ms-auto d-flex align-items-center gap-2">
        <label for="track-sort" class="small muted mb-0">Ordenar</label>
        <select id="track-sort" class="form-select form-select-sm" style="width:auto">
          <option value="mine">Mi orden</option>
          <option value="close">Más cerca de terminar</option>
          <option value="name">Nombre</option>
        </select>
      </div>
    </div>
    <div id="track-list" class="track-list"></div>

    <section class="mt-4" id="teams-wrap" aria-labelledby="teams-title" hidden>
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
        <h2 class="tile-title mb-0" id="teams-title">Equipos</h2>
        <button type="button" class="btn-ghost" id="btn-team-new">+ Nuevo equipo</button>
      </div>
      <div id="teams-list" class="track-list"></div>
    </section>

    <div class="total-wrap mt-4" id="total-wrap" hidden>
      <button type="button" class="btn-ghost" id="btn-total" aria-expanded="false" aria-controls="total-box">Total de todos tus personajes</button>
      <section class="tile mt-3" id="total-box" hidden aria-live="polite"></section>
    </div>

    <section class="tile track-empty" id="track-empty" hidden>
      <h2 class="tile-title">Aún no hay personajes en el tracker</h2>
      <p class="muted mb-3">Elige un personaje en el catálogo, configura su nivel, talentos y arma, anota los materiales que ya tienes y envíalo aquí para ver su porcentaje de avance.</p>
      <div><a class="btn-apple text-decoration-none" href="personajes.html">Ir al catálogo</a></div>
    </section>
    </div>
  </main>
</body>
</html>
